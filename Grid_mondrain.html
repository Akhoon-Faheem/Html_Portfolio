<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
    body{
      padding: 0;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container{
      width: 748px;
      height: 748px;
      display: grid;
      background-color: #000;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 130px 155px 22px;
      gap:9px;
    }
    .red{
      grid-area: 1 / 1 / 2 / 2;
     background-color: #E72F24;
    }
    .big_white{
      grid-area: 1 / 2 / 2 / 5;
      background-color: #F0F1EC;
    }
    .B_white1{
     grid-area: 2 / 1 / 4 / 2;
     background-color: #F0F1EC;
    }
    .B_white2{
      grid-area: 2 / 2 / 4 / 4;
      background-color: #F0F1EC;
    }
    .blue{
      grid-area: 2 / 4 / 3 / 5;
      background-color: #004592;
    }
    .Vs_white{
     grid-area: 3 / 4 / 5 / 5;
     background-color: #F0F1EC;
    }
    .ws_white{
    grid-area: 4 / 1 / 5 / 2;
    background-color: #F0F1EC;
    }
    .yellow{
      grid-area: 4 / 2 / 5 / 3;
      background-color: #F9D01E;
    }
    .black{
    grid-area: 4 / 3 / 5 / 4;
    background-color: #232629;
    }
  </style>
</head>

<body>
  <!-- Write your HTML here -->
</body>
<div class="container">
  <div class="item red"></div>
  <div class="item big_white"></div>
  <div class="item B_white1"></div>
  <div class="item B_white2"></div>
  <div class="item blue"></div>
  <div class="item Vs_white"></div>
  <div class="item ws_white"></div>
  <div class="item yellow"></div>
  <div class="item black"></div>




</div>
</html>
