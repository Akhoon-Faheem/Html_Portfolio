<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Sono", sans-serif;
      }

      /* Hint: What can you do with a media query and flexbox? */
      @media (max-width: 1250px) {
        *{
          margin: 0;
          padding:0;
        }
        .pricing-container{
          border: 1px solid yellowgreen;
          padding: 20px;
          margin: 10px;
          display: flex;
          flex-direction: column;
          gap: 30px;
          align-items: center;
        }

        .pricing-plan{
          border: 1px solid black;
          border-radius: 10px;
          padding: 10px;
          margin:5px;
          flex-basis: 250px;
          width:250px;
          text-align: center;
          background-color: #FFF3C8;
        }
        .plan-title{
          border: 1px solid yellowgreen;
          font-weight: 900;
          font-size: 1.5rem;
          margin-bottom: 20px;
          background-color: aqua;
          

        }
        .plan-price{
          font-weight: 900;
          font-size: 2rem;
          margin-bottom: 20px;
        }
        .plan-features{
          padding: 2px;
          margin-bottom: 20px;
          margin-top: 20px;
          list-style: none;
        }
        li{
          margin-bottom: 15px;
          font-size: 15px;
        }
        .plan-button{
          width:80px;
          height: 28px;
          padding: 5px;
          background-color: orange;
          color: white;
          font-weight: 700;
          text-transform: capitalize;
          border-radius: 2px;
        }
      }
      @media (min-width:1251px) {
        *{
          margin: 0;
          padding:0;
        }
        .pricing-container{
          border: 1px solid yellowgreen;
          padding: 20px;
          margin: 10px;
          display: flex;
          flex-direction: row;
          gap: 20px;
          justify-content: space-around;
          height: 90vh;
          align-items: center;
        }
        .pricing-plan{
          border: 1px solid black;
          border-radius: 10px;
          padding: 10px;
          margin:5px;
          flex-basis: 350px;
          height:350px;
          text-align: center;
          background-color: #FFF3C8;
        }
        .plan-title{
          border: 1px solid yellowgreen;
          font-weight: 900;
          font-size: 2rem;
          margin-bottom: 20px;
          background-color: aqua;
        }

        .plan-price{
          font-weight: 900;
          font-size: 2.5rem;
          margin-bottom: 20px;
        }
        .plan-features{
          padding: 5px;
          margin-bottom: 30px;
          margin-top: 30px;
          list-style: none;
        }
        li{
          margin-bottom: 20px;
          font-size: 20px;
        }
        .plan-button{
          width: 80px;
          height: 30px;
          padding: 5px;
          background-color: orange;
          color: white;
          font-weight: 900;
          text-transform: capitalize;
          border-radius: 2px;
        }


      }
    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basic</div>
        <div class="plan-price">$9.99/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standard</div>
        <div class="plan-price">$19.99/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>
        <div class="plan-price">$49.99/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
